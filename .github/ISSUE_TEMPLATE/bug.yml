name: Something is wrong
description: A reply, setting or feature that doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Paste the reply or the `shoga status` output if you can." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: input
    id: version
    attributes: { label: "Claude Code version (claude --version)" }
