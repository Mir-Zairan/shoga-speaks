<style>
.bg { fill: #EAF8EF; } .spot { fill: #D2F1DF; } .word { fill: #15301F; } .tag { fill: #4B6B5B; }
.bubFill { fill: #FFFFFF; } .say { fill: #15301F; } .lang { fill: #5E7A6C; } .dot { fill: #15301F; opacity: .08; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0E1A15; } .spot { fill: #15291F; } .word { fill: #F1F7F3; } .tag { fill: #9BB8A9; }
  .bubFill { fill: #F7FBF8; } .dot { fill: #fff; opacity: .06; }
}
.bub { transform-box: fill-box; transform-origin: 0% 60%; opacity: 0; }
@keyframes pop0 { 0%, 5.8% { opacity: 0; transform: translate(-150px, 110px) scale(.2) rotate(-8deg); } 8.2% { opacity: 1; transform: translate(6px, 0) scale(1.06) rotate(1deg); } 9.3% { transform: translate(-2px, 0) scale(.98) rotate(0deg); } 10.4%, 80% { opacity: 1; transform: none; } 82.9%, 100% { opacity: 0; transform: translate(-40px, 0) scale(.6); } }
.b0 { animation: pop0 12s infinite; }
@keyframes pop1 { 0%, 11.2% { opacity: 0; transform: translate(-150px, 5px) scale(.2) rotate(-8deg); } 13.6% { opacity: 1; transform: translate(6px, 0) scale(1.06) rotate(1deg); } 14.8% { transform: translate(-2px, 0) scale(.98) rotate(0deg); } 15.8%, 80.7% { opacity: 1; transform: none; } 83.6%, 100% { opacity: 0; transform: translate(-40px, 0) scale(.6); } }
.b1 { animation: pop1 12s infinite; }
@keyframes pop2 { 0%, 16.7% { opacity: 0; transform: translate(-150px, -100px) scale(.2) rotate(-8deg); } 19% { opacity: 1; transform: translate(6px, 0) scale(1.06) rotate(1deg); } 20.2% { transform: translate(-2px, 0) scale(.98) rotate(0deg); } 21.2%, 81.3% { opacity: 1; transform: none; } 84.2%, 100% { opacity: 0; transform: translate(-40px, 0) scale(.6); } }
.b2 { animation: pop2 12s infinite; }
.bubIn { animation: drift 6s ease-in-out infinite; } .b1 .bubIn { animation-delay: -2s; } .b2 .bubIn { animation-delay: -4s; }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.jaw { transform-origin: 278px 170px; animation: jaw 12s infinite; }
@keyframes jaw { 0% { transform: rotate(0deg); } 5.4% { transform: rotate(0deg); } 6.5% { transform: rotate(18deg); } 8.3% { transform: rotate(0deg); } 10.8% { transform: rotate(0deg); } 11.9% { transform: rotate(18deg); } 13.8% { transform: rotate(0deg); } 16.2% { transform: rotate(0deg); } 17.3% { transform: rotate(18deg); } 19.2% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
.talk { transform-origin: 356px 172px; opacity: 0; animation: talk 12s infinite; }
@keyframes talk { 0% { opacity: 0; } 5.8% { opacity: 0; transform: scale(.6); } 6.7% { opacity: 1; transform: scale(1); } 8.7% { opacity: 0; transform: scale(1.15); } 11.2% { opacity: 0; transform: scale(.6); } 12.1% { opacity: 1; transform: scale(1); } 14.2% { opacity: 0; transform: scale(1.15); } 16.7% { opacity: 0; transform: scale(.6); } 17.5% { opacity: 1; transform: scale(1); } 19.6% { opacity: 0; transform: scale(1.15); } 100% { opacity: 0; } }

.mascot { transform-origin: 170px 410px; animation: body 12s infinite; }
@keyframes body { 0%, 2.5% { transform: none; } 4.6% { transform: scale(1.03, .96); }
  6.2% { transform: rotate(4deg) translateX(6px); } 19.2% { transform: rotate(4deg) translateX(6px); }
  21.2% { transform: scale(1.04, .94); } 23.3% { transform: translateY(-26px) scale(.98, 1.04); }
  25.4% { transform: scale(1.05, .94); } 27.5%, 100% { transform: none; } }
.bod { transform-origin: 170px 392px; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
.tail { transform-origin: 140px 330px; animation: wag 4s ease-in-out infinite; }
@keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
.lid { transform-origin: 222px 92px; transform: scaleY(0); animation: blink 4.4s infinite; }
@keyframes blink { 0%, 88%, 100% { transform: scaleY(0); } 92% { transform: scaleY(1); } 96% { transform: scaleY(0); } }
.pupil { animation: look 12s ease-in-out infinite; }
@keyframes look { 0%, 4.2% { transform: translate(0, 0); } 6.7%, 75% { transform: translate(3px, 1px); } 80%, 100% { transform: translate(0, 0); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .bub { opacity: 1 !important; transform: none !important; }
}
.talk { display: none; } .mascot, .jaw, .pupil { animation: none; }</style>
