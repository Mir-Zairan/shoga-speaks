@keyframes tab2 { 0%, 64.3% { opacity: .45; } 65.4%, 92.9% { opacity: 1; } 93.9%, 100% { opacity: .45; } } .tab2 { animation: tab2 14s infinite; } @keyframes tabf2 { 0%, 64.3% { fill-opacity: 0; } 65.4%, 92.9% { fill-opacity: 1; } 93.9%, 100% { fill-opacity: 0; } } .tab2 rect { animation: tabf2 14s infinite; } @keyframes tabo2 { 0%, 64.3% { opacity: 0; } 65.4%, 92.9% { opacity: 1; } 93.9%, 100% { opacity: 0; } } .tab2 .on { animation: tabo2 14s infinite; }
