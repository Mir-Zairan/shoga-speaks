@keyframes nod { 0% { transform: none; } 37.9% { transform: none; } 39.3% { transform: rotate(3deg) translateX(4px); } 41.4% { transform: none; } 63.6% { transform: none; } 65% { transform: rotate(3deg) translateX(4px); } 67.1% { transform: none; } 100% { transform: none; } }

.mascot { transform-origin: 170px 410px; animation: body 14s infinite; }
@keyframes body { 0%, 2.1% { transform: none; } 3.9% { transform: scale(1.03, .96); }
  5.4% { transform: rotate(4deg) translateX(6px); } 15.7% { transform: rotate(4deg) translateX(6px); }
  17.5% { transform: scale(1.04, .94); } 19.3% { transform: translateY(-26px) scale(.98, 1.04); }
  21.1% { transform: scale(1.05, .94); } 22.9%, 100% { transform: none; } }
.bod { transform-origin: 170px 392px; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
.tail { transform-origin: 140px 330px; animation: wag 4s ease-in-out infinite; }
@keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
.lid { transform-origin: 222px 92px; transform: scaleY(0); animation: blink 4.4s infinite; }
@keyframes blink { 0%, 88%, 100% { transform: scaleY(0); } 92% { transform: scaleY(1); } 96% { transform: scaleY(0); } }
.pupil { animation: look 14s ease-in-out infinite; }
@keyframes look { 0%, 3.6% { transform: translate(0, 0); } 5.7%, 85.7% { transform: translate(3px, 1px); } 90%, 100% { transform: translate(0, 0); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .bub { opacity: 1 !important; transform: none !important; }
  .say { opacity: 0 !important; } .t00, .t10, .t20 { opacity: 1 !important; }
  .tab { opacity: .45 !important; } .tab0 { opacity: 1 !important; } .tab rect { fill-opacity: 0 !important; } .tab0 rect { fill-opacity: 1 !important; } .tab0 .on { opacity: 1 !important; }
}
.talk { display: none; } .mascot, .jaw, .pupil { animation: none; }</style>
